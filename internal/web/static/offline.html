<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Offline — SchalekPage</title>
<style>
    :root { --canvas: #000; --ink: #fafafa; --ink-3: #7a7a7a; }
    @media (prefers-color-scheme: light) {
        :root { --canvas: #fff; --ink: #000; --ink-3: #7a7a7a; }
    }
    * { box-sizing: border-box; }
    html, body {
        height: 100%;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: Helvetica, Arial, sans-serif;
    }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }
    h1 {
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
    }
    p {
        color: var(--ink-3);
        font-size: 0.9rem;
        margin: 0 0 1.5rem;
        max-width: 24rem;
    }
    button {
        appearance: none;
        background: var(--ink);
        color: var(--canvas);
        border: 0;
        padding: 0.75rem 1.5rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.75rem;
        cursor: pointer;
    }
</style>
</head>
<body>
    <h1>You're offline</h1>
    <p>SchalekPage couldn't reach the server, and this page isn't saved on your device. Pages you've already opened still work.</p>
    <button onclick="location.reload()">Retry</button>
</body>
</html>
